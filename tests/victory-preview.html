<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Victory effect verification</title><link rel="stylesheet" href="../style.css"></head><body><main><h1>Rainbow burst preview</h1><p>Isolated visual test. No saved levels are changed.</p><div class="stage" style="border-radius:14px;overflow:hidden"><canvas id="scene" width="1440" height="640"></canvas><canvas id="victoryFx" width="1440" height="640"></canvas></div><button id="burst">Replay rainbow explosion</button><button id="reduced">Reduced motion preview</button><p id="result" role="status"></p></main><script src="../engine.js"></script><script src="../victory.js"></script><script>
const scene=document.getElementById('scene').getContext('2d'),fxctx=document.getElementById('victoryFx').getContext('2d');scene.fillStyle='#e9f3f3';scene.fillRect(0,0,1440,640);scene.fillStyle='#739c88';scene.fillRect(0,560,1440,80);scene.fillStyle='#237c70';scene.fillRect(710,270,6,290);scene.beginPath();scene.moveTo(716,270);scene.lineTo(805,290);scene.lineTo(780,320);scene.lineTo(716,315);scene.fill();let fx=null,last=0;document.getElementById('burst').onclick=()=>{fx=TrailVictory.create(720,300);document.getElementById('result').textContent='216 confetti pieces, six expanding rainbow rings, three burst waves.';};document.getElementById('reduced').onclick=()=>{fx=TrailVictory.create(720,300,true);document.getElementById('result').textContent='Reduced motion: a static six-color halo.';};function draw(t){TrailVictory.draw(fxctx,fx,Math.min((t-last)/1000,.05));last=t;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
